<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161925">
<meta name="color-scheme" content="dark">
<title>mexord ▮ v6 — neon flamme</title>
<meta name="description" content="Design-Sonde V6: NEON-Flamme als gemaltes Radial-Glow-Kunstwerk unter Glas, KLARHEIT in massiv Pink, 11 @keyframes, kein blur auf grossen Flaechen.">
<style>
/* ==================================================================
   SONDE V6 — Neon-Flamme (Korrektur von V5 "Sweet Flame")
   V5-Fehler: Ich habe GEMALT mit NEON verwechselt. Garuda ist
   weiche, gemalte Radial-Kunst (wie in Marcos Screenshots), nicht
   harte Linear-Bloecke, scharfe Boegen oder Neongelb-Chartreuse.
   V6: Nur Radial-Glows (weich, dramatisch, ueberlappend, Alpha
   ~.5-.8) -> ein Kunst-PNG in CSS. Glas mit backdrop-filter.
   Farben: ausschliesslich sweet.colors · D-001/002/003 gelten
   ================================================================== */
:root{
  --sweet-deep:#161925;
  --sweet-violet:#8500F7;
  --sweet-pink:#ED1515;
  --sweet-orange:#F67400;
  --sweet-yellow:#C9CE3B;
  --sweet-green:#11D116;
  --sweet-blue:#3DAEE9;
  --sweet-gold:#FDBC4B;
  --sweet-white:#FFFFFF;
  --sweet-tip:#BDC3C7;
  --overshoot:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--sweet-deep);
  color:var(--sweet-white);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  overflow-x:hidden;
  min-height:100svh;
}
::selection{background:var(--sweet-violet);color:var(--sweet-white)}

/* ================= KUNST: die Flamme (3 weiche Radial-Protagonisten) ================= */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0}
.ember{ /* Pink-Rot, oben links — Glut in der Luft */
  position:fixed;inset:-25% 52% 45% -10%;
  background:radial-gradient(ellipse at 60% 55%,rgba(237,21,21,.52),rgba(237,21,21,0) 65%);
  animation:emberDrift 38s ease-in-out infinite alternate;
}
.blaze{ /* Orange, unten rechts — die Flamme selbst */
  position:fixed;inset:42% -12% -18% 48%;
  background:radial-gradient(ellipse at 55% 60%,rgba(246,116,0,.58),rgba(246,116,0,0) 68%);
  animation:blazeDrift 34s ease-in-out infinite alternate;
}
.myst{ /* Violett, zentral — der Film darüber */
  position:fixed;inset:8% 28% 38% 12%;
  background:radial-gradient(ellipse at 48% 48%,rgba(133,0,247,.46),rgba(133,0,247,0) 70%);
  animation:mystrift 42s ease-in-out infinite alternate;
}
.spot{ /* Gold, klein, oben rechts — Funken, kein Bogen */
  position:fixed;width:32vmax;height:32vmax;right:5%;top:4%;
  background:radial-gradient(circle,rgba(253,188,75,.35),rgba(253,188,75,0) 60%);
  animation:spotPulse 9s ease-in-out infinite;
}
.vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at center,rgba(22,25,37,0) 34%,rgba(22,25,37,.36) 100%);
}

/* ================= GLAS: die Insel, die das Artwork freigibt ================= */
.stage{
  position:relative;z-index:1;
  min-height:100svh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(1rem,3vw,1.6rem);
  padding:calc(clamp(3.5rem,8vh,5rem) + env(safe-area-inset-top)) clamp(1rem,4vw,3rem) calc(clamp(5rem,11vh,7rem) + env(safe-area-inset-bottom));
}
.wobble-wrap{
  transform-origin:50% 100%;
  animation:jelly 7.5s ease-in-out infinite,cardFloat 8.5s ease-in-out infinite alternate;
  will-change:transform;
}
.card{
  position:relative;overflow:hidden;
  width:min(90vw,38rem);
  padding:clamp(1.75rem,6vw,3.5rem) clamp(1.3rem,5vw,3rem);
  background:rgba(22,25,37,.48);
  -webkit-backdrop-filter:blur(12px) saturate(1.5);
  backdrop-filter:blur(12px) saturate(1.5);
  border:1px solid rgba(255,255,255,.3);
  border-top-color:rgba(255,255,255,.5);
  border-radius:clamp(18px,3vw,24px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.28),
    0 30px 70px rgba(0,0,0,.5);
  text-align:center;
  contain:layout paint;
  animation:cardSettle .9s ease-out backwards;
}
.card::before{ /* Sweep beweist Glas physikalisch */
  content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:32%;
  background:linear-gradient(115deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.18) 50%,rgba(255,255,255,0) 100%);
  transform:translateX(-170%) skewX(-14deg);
  animation:sweep 8s ease-in-out 1.4s infinite;
  pointer-events:none;
}
.eyebrow{
  font-size:clamp(.68rem,2.3vw,.9rem);
  font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.82);
  margin-bottom:clamp(1rem,3vw,1.4rem);
}
.statement{
  font-size:clamp(2.6rem,11.5vw,4.9rem);
  font-weight:900;line-height:.96;letter-spacing:-.015em;
  text-transform:uppercase;
}
.statement .line{display:block}
.line-1{animation:reveal .75s var(--overshoot) .3s backwards}
.line-3{animation:reveal .75s var(--overshoot) 1.9s backwards}
.statement .hot{ /* NEON: rot-pink mit Halo, wie Marcos frühere Sonde */
  display:inline-block;
  padding:.03em .18em;border-radius:.14em;
  background:rgba(22,25,37,.6);
  color:var(--sweet-pink);
  text-shadow:0 0 30px rgba(237,21,21,.9);
  box-shadow:0 0 26px rgba(237,21,21,.35),inset 0 1px 0 rgba(255,255,255,.14);
  animation:revealHot .8s var(--overshoot) 1.1s backwards,
            pinkHalo 3s ease-in-out 2s infinite;
}
.prompt{
  margin-top:clamp(1.2rem,3.5vw,1.8rem);
  font-family:ui-monospace,"Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
  font-size:clamp(.75rem,2.7vw,1rem);
  color:var(--sweet-tip);
  min-height:1.4em;
}
.proof{
  margin-top:.35rem;font-size:clamp(.7rem,2.4vw,.85rem);
  color:rgba(255,255,255,.72);letter-spacing:.04em;
}
.prompt .user{color:var(--sweet-green)}
.prompt .path{color:var(--sweet-blue)}
.prompt .dollar{color:var(--sweet-gold)}
.caret{
  display:inline-block;width:.55em;height:1.05em;margin-left:.15em;
  background:var(--sweet-pink);vertical-align:text-bottom;
  animation:blink 1.05s steps(1) infinite;
}

/* ================= EINE Neben-Karte, dezent links unten ================= */
.status{
  position:fixed;left:clamp(.9rem,3vw,2rem);
  bottom:calc(clamp(.9rem,3vw,2rem) + env(safe-area-inset-bottom));
  z-index:2;display:inline-flex;align-items:center;gap:.55rem;
  padding:.65rem 1rem;
  background:rgba(22,25,37,.6);
  -webkit-backdrop-filter:blur(12px) saturate(1.5);
  backdrop-filter:blur(12px) saturate(1.5);
  border:1px solid rgba(255,255,255,.28);
  border-radius:14px;
  box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.2);
  font-family:ui-monospace,"Cascadia Mono",Menlo,monospace;
  font-size:.78rem;color:var(--sweet-tip);
  animation:cardSettle .9s ease-out .5s backwards,statusBob 7s ease-in-out 1.7s infinite alternate;
}
.status .dot{
  width:.6em;height:.6em;border-radius:50%;
  background:var(--sweet-green);
  box-shadow:0 0 12px rgba(17,209,22,.9);
  animation:dotPulse 2.2s ease-in-out infinite;
}
.status b{color:var(--sweet-yellow)}

/* ================= Keyframes (11) ================= */
@keyframes emberDrift{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(-3%,4%) scale(1.07)}
}
@keyframes blazeDrift{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(4%,-5%) scale(1.05)}
}
@keyframes mystrift{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(2%,3%) scale(1.04)}
}
@keyframes spotPulse{
  0%,100%{opacity:.7;transform:scale(1)}
  50%{opacity:1;transform:scale(1.1)}
}
@keyframes jelly{
  0%,100%{transform:skewX(0) scale(1)}
  24%{transform:skewX(1deg) scaleX(1.01) scaleY(.992)}
  48%{transform:skewX(-.8deg) scaleX(.994) scaleY(1.008)}
  74%{transform:skewX(.35deg) scaleX(1) scaleY(1)}
}
@keyframes cardFloat{
  0%{transform:translateY(0)}
  100%{transform:translateY(-8px)}
}
@keyframes sweep{
  0%{transform:translateX(-170%) skewX(-14deg)}
  55%,100%{transform:translateX(420%) skewX(-14deg)}
}
@keyframes reveal{
  0%{opacity:0;transform:translateY(14px);filter:blur(9px)}
  100%{opacity:1;transform:translateY(0);filter:blur(0)}
}
@keyframes revealHot{
  0%{opacity:0;transform:scale(.84)}
  70%{opacity:1;transform:scale(1.05)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes pinkHalo{
  0%,100%{text-shadow:0 0 24px rgba(237,21,21,.8)}
  50%{text-shadow:0 0 44px rgba(237,21,21,1),0 0 80px rgba(133,0,247,.4)}
}
@keyframes blink{
  0%,49%{opacity:1}
  50%,100%{opacity:0}
}
@keyframes cardSettle{
  0%{opacity:0;transform:translateY(18px)}
  100%{opacity:1;transform:translateY(0)}
}
@keyframes statusBob{
  0%{transform:translateY(0)}
  100%{transform:translateY(-5px)}
}
@keyframes dotPulse{
  0%,100%{opacity:.55;transform:scale(1)}
  50%{opacity:1;transform:scale(1.12)}
}

/* ================= <560px: Status im Flow ================= */
@media (max-width:560px){
  .status{position:static;margin-top:1rem;animation:cardSettle .9s ease-out .5s backwards}
  .wobble-wrap{animation-duration:10s}
}
@media (min-width:720px){
  .statement{letter-spacing:-.025em}
}
@media (hover:none){.card:hover{animation:inherit}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="ember"></div>
  <div class="blaze"></div>
  <div class="myst"></div>
  <div class="spot"></div>
  <div class="vignette"></div>
</div>

<main class="stage">
  <div class="wobble-wrap">
    <article class="card" id="hero-card">
      <p class="eyebrow">Neues aus dem Kopf eines GF</p>
      <h1 class="statement">
        <span class="line line-1">Führung.</span>
        <span class="line hot">Klarheit.</span>
        <span class="line line-3">Wirkung.</span>
      </h1>
      <p class="prompt"><span class="user">marco@mexord</span><span>:</span> <span class="path">~</span><span class="dollar">$ </span><span id="typed"></span><span class="caret" aria-hidden="true"></span></p>
      <p class="proof">Aus dem Alltag als GF — 1× wöchentlich, kein Marketing.</p>
    </article>
  </div>

  <aside class="status" role="status" aria-live="off">
    <!-- data-source: hugo-params (später parameterisiert) -->
    <span class="dot" aria-hidden="true"></span><span><b>LIVE</b> · 3 neue Beiträge · mexord.blog</span>
  </aside>
</main>

<noscript>
  <style>#typed::after{content:"cat management_ki_opensource.txt"}</style>
</noscript>

<script>
const mockData={promptCommand:"cat management_ki_opensource.txt"};
const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
(function typing(){
  const el=document.getElementById("typed");
  const text=mockData.promptCommand;
  if(reduced){el.textContent=text;return;}
  let i=0;
  const iv=setInterval(()=>{
    el.textContent=text.slice(0,++i);
    if(i>=text.length)clearInterval(iv);
  },52);
})();
</script>
</body>
</html>
