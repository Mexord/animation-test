<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161925">
<meta name="color-scheme" content="dark">
<title>mexord ▮ sonde v4 — glas &amp; neon-bande</title>
<meta name="description" content="Design-Sonde V4 für mexord.blog: eine scharfe Neon-Energiebande fließt UNTER echtem Glas hindurch. Ruhe durch Abstand, Farbe aus sweet.colors.">
<style>
/* ==================================================================
   SONDE V4 — Glas & Neon-Bande (mexord.blog)
   Lektion aus V3 ("Chaos-Überfall, kein Glas"):
   · Blur wirkt nur sichtbar, wenn dahinter SCHARFER KONTRAST bewegt wird
   · Neon-Energie durch EINE Bande + EINEN Glow — nicht durch 7 Quellen
   · Glas bleibt DUNKEL (alpha .38); KLARHEIT in Gold auf schwarzer
     Halb-Pille, damit sie auf Band/Grund lesbar bleibt
   · Kein position:fixed-Chaos: eine Chip-Reihe im normalen Flow
   Farben: ausschließlich sweet.colors · D-001/002/003 gelten weiter
   ================================================================== */
:root{
  --sweet-deep:#161925;
  --sweet-violet:#8500F7;
  --sweet-pink:#ED1515;
  --sweet-orange:#F67400;
  --sweet-yellow:#C9CE3B;
  --sweet-green:#11D116;
  --sweet-blue:#3DAEE9;
  --sweet-gold:#FDBC4B;
  --sweet-white:#FFFFFF;
  --sweet-tip:#BDC3C7;
  --overshoot:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--sweet-deep);
  color:var(--sweet-white);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  overflow-x:hidden;
  min-height:100svh;
}
::selection{background:var(--sweet-violet);color:var(--sweet-white)}

/* ================= ARTWORK: EINE bewegte Bande + EIN Glow ================= */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0}
.band{
  position:absolute;inset:-35%;
  z-index:0;
  background:linear-gradient(115deg,
    rgba(22,25,37,0) 0%,
    rgba(133,0,247,0) 30%,
    rgba(133,0,247,.85) 38%,
    rgba(237,21,21,.9) 44%,
    rgba(246,116,0,.85) 50%,
    rgba(61,174,233,.75) 56%,
    rgba(61,174,233,0) 63%,
    rgba(22,25,37,0) 100%);
  background-size:220% 220%;
  filter:blur(26px) saturate(1.65) contrast(1.15);
  mix-blend-mode:screen;
  will-change:transform;
  transform:rotate(-6deg);
  animation:energyflow 26s ease-in-out infinite alternate;
}
.band-counter{ /* Gegenläufer, subtiler — kontrolliertes Beben, kein Chaos */
  position:absolute;inset:-35%;z-index:0;
  background:linear-gradient(295deg,
    rgba(22,25,37,0) 0%,
    rgba(133,0,247,0) 34%,
    rgba(201,206,59,.35) 44%,
    rgba(253,188,75,.3) 50%,
    rgba(253,188,75,0) 58%,
    rgba(22,25,37,0) 100%);
  background-size:240% 240%;
  filter:blur(34px) saturate(1.4);
  mix-blend-mode:screen;
  will-change:transform;
  transform:rotate(-6deg);
  animation:counterflow 37s ease-in-out infinite alternate;
}
.glow-corner{ /* eine Lichtquelle, sonst nichts */
  position:absolute;width:60vmax;height:60vmax;right:-20vmax;top:-20vmax;
  border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(133,0,247,.22) 0%,rgba(133,0,247,0) 60%);
  mix-blend-mode:screen;
}
.vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at center,rgba(22,25,37,0) 34%,rgba(22,25,37,.4) 100%);
}

/* ================= Bühne + Hero-Karte (das Glas) ================= */
.stage{
  position:relative;z-index:1;
  min-height:100svh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(1rem,2.6vw,1.75rem);
  padding:calc(clamp(4rem,9vh,6rem) + env(safe-area-inset-top)) clamp(1rem,4vw,3rem) calc(clamp(2rem,6vh,4rem) + env(safe-area-inset-bottom));
}
.float-wrap{
  animation:cardFloat 7.5s ease-in-out infinite,
            cardWobble 9.5s ease-in-out infinite reverse;
  will-change:transform;
}
.card{
  position:relative;overflow:hidden;
  width:min(92vw,46rem);
  padding:clamp(2rem,6vw,4rem) clamp(1.4rem,5vw,3.5rem);
  background:rgba(22,25,37,.38);
  -webkit-backdrop-filter:blur(18px) saturate(1.55);
  backdrop-filter:blur(18px) saturate(1.55);
  border:1.5px solid rgba(255,255,255,.22);
  border-top-color:rgba(255,255,255,.45);
  border-radius:clamp(18px,3vw,26px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.25),
    inset 0 -30px 60px -30px rgba(133,0,247,.35),
    0 30px 70px rgba(0,0,0,.5);
  text-align:center;
  contain:layout paint;
  animation:glowBreath 8s ease-in-out infinite;
}
.card::before{ /* Glasschein-Sweep — beweist den Schimmer */
  content:"";position:absolute;top:-25%;bottom:-25%;left:0;width:30%;
  background:linear-gradient(115deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.16) 50%,rgba(255,255,255,0) 100%);
  transform:translateX(-180%) skewX(-14deg);
  animation:glassSweep 7s ease-in-out 1.6s infinite;
  pointer-events:none;
}
.eyebrow{
  font-size:clamp(.68rem,2.3vw,.9rem);
  font-weight:700;letter-spacing:.3em;text-transform:uppercase;
  color:var(--sweet-blue);
  margin-bottom:clamp(1rem,3vw,1.6rem);
}
.statement{
  font-size:clamp(2.4rem,11.5vw,6rem);
  font-weight:900;line-height:.95;letter-spacing:-.015em;
  text-transform:uppercase;
}
.statement .line{display:block}
.line-1{animation:revealLeft 1s var(--overshoot) .15s backwards}
.line-3{animation:revealRight 1s var(--overshoot) .8s backwards}
.statement .hot{ /* der Goldfokus, lesbar überall */
  display:inline-block;
  padding:.02em .22em .06em;border-radius:.18em;
  background:linear-gradient(160deg,rgba(22,25,37,.8),rgba(22,25,37,.55));
  color:var(--sweet-gold);
  -webkit-text-stroke:1px rgba(22,25,37,.35);
  text-shadow:0 0 26px rgba(253,188,75,.5),0 2px 12px rgba(0,0,0,.7);
  border:1px solid rgba(253,188,75,.28);
  animation:revealCenter 1s var(--overshoot) .45s backwards,
            goldPulse 3.6s ease-in-out 1.6s infinite;
}
.prompt{
  margin-top:clamp(1.2rem,3.5vw,1.9rem);
  font-family:ui-monospace,"Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
  font-size:clamp(.75rem,2.7vw,1rem);
  color:var(--sweet-tip);
  min-height:1.4em;
}
.prompt .user{color:var(--sweet-green)}
.prompt .path{color:var(--sweet-blue)}
.prompt .dollar{color:var(--sweet-orange)}
.caret{
  display:inline-block;width:.55em;height:1.05em;margin-left:.15em;
  background:var(--sweet-gold);vertical-align:text-bottom;
  animation:caretBlink 1.05s steps(1) infinite;
}

/* ================= EINE Chip-Reihe im Flow (kein fixed-Chaos) ================= */
.chips{
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:.7rem;max-width:min(92vw,46rem);
}
.chip{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.6rem 1rem;
  background:rgba(22,25,37,.5);
  -webkit-backdrop-filter:blur(18px) saturate(1.55);
  backdrop-filter:blur(18px) saturate(1.55);
  border:1px solid rgba(255,255,255,.18);
  border-radius:999px;
  box-shadow:0 12px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2);
  font-family:ui-monospace,"Cascadia Mono",Menlo,monospace;
  font-size:.78rem;letter-spacing:.05em;
  color:var(--sweet-tip);
  animation:chipPop .55s var(--overshoot) calc(1s + var(--i,0)*.2s) backwards,
            chipBob 6s ease-in-out calc(1.8s + var(--i,0)*.2s) infinite alternate;
}
.chip .dot{
  width:.55em;height:.55em;border-radius:50%;
  box-shadow:0 0 10px currentColor;
}
.dot-green{background:var(--sweet-green);color:var(--sweet-green)}
.dot-violet{background:var(--sweet-violet);color:var(--sweet-violet)}
.dot-yellow{background:var(--sweet-yellow);color:var(--sweet-yellow)}
.chip b{color:var(--sweet-gold);font-weight:800}

/* ================= Keyframes (14, bewusst sichtbar statt viele) ================= */
@keyframes energyflow{
  0%{transform:rotate(-6deg) translate3d(-6%,-4%,0) scale(1)}
  100%{transform:rotate(-6deg) translate3d(6%,4%,0) scale(1.08)}
}
@keyframes counterflow{
  0%{transform:rotate(-6deg) translate3d(5%,3%,0) scale(1.06)}
  100%{transform:rotate(-6deg) translate3d(-5%,-3%,0) scale(1)}
}
@keyframes cardFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-9px)}
}
@keyframes cardWobble{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(.7deg)}
  55%{transform:rotate(-.8deg)}
  80%{transform:rotate(.3deg)}
}
@keyframes glassSweep{
  0%{transform:translateX(-180%) skewX(-14deg)}
  55%,100%{transform:translateX(420%) skewX(-14deg)}
}
@keyframes glowBreath{
  0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -30px 60px -30px rgba(133,0,247,.35),0 30px 70px rgba(0,0,0,.5),0 0 34px rgba(133,0,247,.12)}
  50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -30px 60px -30px rgba(237,21,21,.3),0 30px 70px rgba(0,0,0,.5),0 0 52px rgba(237,21,21,.18)}
}
@keyframes revealLeft{
  0%{opacity:0;transform:translateX(-2.2rem);filter:blur(8px)}
  100%{opacity:1;transform:translateX(0);filter:blur(0)}
}
@keyframes revealRight{
  0%{opacity:0;transform:translateX(2.2rem);filter:blur(8px)}
  100%{opacity:1;transform:translateX(0);filter:blur(0)}
}
@keyframes revealCenter{
  0%{opacity:0;transform:scale(.7);filter:blur(10px)}
  70%{opacity:1;transform:scale(1.06);filter:blur(0)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes goldPulse{
  0%,100%{text-shadow:0 0 22px rgba(253,188,75,.45),0 2px 12px rgba(0,0,0,.7)}
  50%{text-shadow:0 0 44px rgba(253,188,75,.85),0 2px 14px rgba(0,0,0,.7)}
}
@keyframes caretBlink{
  0%,49%{opacity:1}
  50%,100%{opacity:0}
}
@keyframes chipPop{
  0%{opacity:0;transform:scale(0)}
  70%{opacity:1;transform:scale(1.1)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes chipBob{
  0%{transform:translateY(0)}
  100%{transform:translateY(-6px)}
}

/* ================= Desktop-Verfeinerungen ================= */
@media (min-width:720px){
  .statement{letter-spacing:-.025em}
  .chips{gap:.95rem}
}
@media (min-width:1200px){
  .card{width:min(62vw,50rem)}
}
/* ================= <560px: Bande steiler, Karte luftiger ================= */
@media (max-width:560px){
  .band,.band-counter{transform:rotate(-14deg)}
  .chips{gap:.55rem}
}
/* ================= Barrierefreiheit: komplett statisch ================= */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="band"></div>
  <div class="band-counter"></div>
  <div class="glow-corner"></div>
  <div class="vignette"></div>
</div>

<main class="stage">
  <div class="float-wrap">
    <article class="card" id="hero-card">
      <p class="eyebrow">Neues aus dem Kopf eines GF</p>
      <h1 class="statement">
        <span class="line line-1">Führung.</span>
        <span class="line hot">Klarheit.</span>
        <span class="line line-3">Wirkung.</span>
      </h1>
      <p class="prompt"><span class="user">marco@mexord</span><span>:</span> <span class="path">~</span><span class="dollar">$ </span><span id="typed"></span><span class="caret" aria-hidden="true"></span></p>
    </article>
  </div>

  <div class="chips" role="list" aria-label="Status">
    <!-- data-source: hugo-params (später parameterisiert) -->
    <span class="chip" role="listitem" style="--i:0"><span class="dot dot-green" aria-hidden="true"></span><span id="chip-status">lade …</span></span>
    <span class="chip" role="listitem" style="--i:1"><span class="dot dot-violet" aria-hidden="true"></span><b>10</b>&nbsp;THEMEN ✦ <b>0</b>&nbsp;TRACKER</span>
    <span class="chip" role="listitem" style="--i:2"><span class="dot dot-yellow" aria-hidden="true"></span>100&nbsp;% SWEET — sweet.colors only</span>
  </div>
</main>

<noscript>
  <style>#typed::after{content:"cat management_ki_opensource.txt"}#chip-status{ }#chip-status::after{content:"system online — glass &amp; neon ready"}</style>
</noscript>

<script>
/* Inhalte datengetrieben (Hugo-Vorbereitung) */
const mockData = {
  status: "system online — glass & neon ready",
  promptCommand: "cat management_ki_opensource.txt"
};
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
document.getElementById("chip-status").textContent = mockData.status;

/* Terminal-Typing: setInterval auf textContent, kein Layout-Read im Loop */
(function typing(){
  const el = document.getElementById("typed");
  const text = mockData.promptCommand;
  if (reduced) { el.textContent = text; return; }
  let i = 0;
  const iv = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i >= text.length) clearInterval(iv);
  }, 52);
})();
</script>
</body>
</html>
