<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161925">
<title>mexord ▮ sonde v1 — sweet plasma</title>
<meta name="description" content="Design-Sonde V1 für mexord.blog: vollflächiges Sweet-Artwork, eine schwebende Glas-Statement-Karte, 8 Animationen, reduced-motion-Fallback.">
<style>
/* ==================================================================
   SONDE V1 — Sweet Plasma (für mexord.blog)
   Farben: ausschließlich sweet.colors (Mapping: design-tokens.md)
   D-001: kein Window-Chrome · D-002: Statement-Set B · D-003: berechnetes Artwork
   ================================================================== */
:root{
  --sweet-win-bg-normal:#161925;      /* Seitengrund */
  --sweet-view-bg-normal:#181B28;     /* Glas-Basis */
  --sweet-win-deco-focus:#8500F7;     /* Fokus-Ring */
  --sweet-win-deco-hover:#8500F7;     /* Hover-Glow */
  --sweet-win-fg-normal:#FFFFFF;      /* Fließtext */
  --sweet-win-fg-inactive:#888888;    /* Sekundärtext */
  --sweet-wm-active-blend:#ABABAB;    /* Glas-Specular */
  --sweet-header-fg-active:#F67400;   /* heißer Akzent */
  --sweet-header-fg-positive:#11D116; /* Statusgrün */
  --sweet-btn-fg-active:#3DAEE9;      /* Terminal-Pfad-Blau */
  --sweet-tip-fg-inactive:#BDC3C7;    /* Tooltip-Sekundärtext */
  --sweet-comp-fg-negative:#ED1515;   /* Rot-Glow, sparsam */
  --sweet-sel-bg-normal:#8500F7;      /* ::selection */
  --sweet-sel-fg-active:#FCFCFC;      /* Text auf ::selection */
  --glass-bg:rgba(24,27,40,.6);
  --glass-border:rgba(171,171,171,.25);
  --glass-blur:blur(22px) saturate(1.45); /* aus [KDE] contrast=4 */
  --overshoot:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--sweet-win-bg-normal);
  color:var(--sweet-win-fg-normal);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  overflow-x:hidden;
  min-height:100dvh;
}
::selection{background:var(--sweet-sel-bg-normal);color:var(--sweet-sel-fg-active)}

/* ---------- Artwork: berechneter Sweet-Hintergrund (D-003) ---------- */
.bg{position:fixed;inset:0;overflow:hidden;filter:saturate(1.35);z-index:0}
.glow{position:absolute;border-radius:50%;pointer-events:none}
.glow-a{
  width:110vmax;height:110vmax;top:-45vmax;left:-35vmax;
  background:radial-gradient(circle,rgba(133,0,247,.6) 0%,rgba(133,0,247,.22) 34%,rgba(133,0,247,0) 62%);
  animation:bgDrift 46s ease-in-out infinite;
}
.glow-b{
  width:95vmax;height:95vmax;right:-40vmax;bottom:-38vmax;
  background:radial-gradient(circle,rgba(246,116,0,.5) 0%,rgba(246,116,0,.18) 32%,rgba(246,116,0,0) 60%);
  animation:bgDriftAlt 58s ease-in-out infinite;
}
.glow-c{
  width:60vmax;height:60vmax;left:8vw;bottom:-22vmax;
  background:radial-gradient(circle,rgba(237,21,21,.3) 0%,rgba(237,21,21,0) 55%);
  animation:bgDrift 71s ease-in-out infinite reverse;
}
.vignette{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(22,25,37,.55) 0%,rgba(22,25,37,0) 28%,rgba(22,25,37,0) 68%,rgba(22,25,37,.8) 100%),
    radial-gradient(ellipse at center,rgba(22,25,37,0) 42%,rgba(22,25,37,.85) 100%);
}

/* ---------- Bühne ---------- */
.stage{
  position:relative;z-index:1;
  min-height:100dvh;
  display:grid;place-items:center;
  padding:clamp(1rem,4vw,3rem);
}
.float-wrap{animation:cardFloat 7s ease-in-out infinite;will-change:transform}

/* ---------- Die EINE Glas-Statement-Karte ---------- */
.card{
  position:relative;
  width:min(94vw,46rem);
  padding:clamp(1.75rem,6vw,4rem) clamp(1.5rem,5vw,3.5rem);
  background:var(--glass-bg);
  -webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  border-radius:clamp(16px,3vw,26px);
  box-shadow:0 24px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(171,171,171,.18);
  text-align:center;
  animation:popIn .9s var(--overshoot) .1s backwards;
  transition:box-shadow .4s ease,border-color .4s ease;
}
.card:hover{
  border-color:var(--sweet-win-deco-hover);
  box-shadow:0 24px 80px rgba(0,0,0,.45),0 0 42px rgba(133,0,247,.5),inset 0 1px 0 rgba(171,171,171,.18);
  animation:wobble .55s ease both;
}
.eyebrow{
  font-size:clamp(.68rem,2.4vw,.95rem);
  font-weight:700;letter-spacing:.32em;text-transform:uppercase;
  color:var(--sweet-win-fg-inactive);
  margin-bottom:clamp(1rem,3vw,1.75rem);
}
.eyebrow::before{content:"~/ ";color:var(--sweet-header-fg-positive)}
.statement{
  font-size:clamp(2.5rem,12.5vw,7.5rem);
  font-weight:900;line-height:.96;letter-spacing:-.015em;
  text-transform:uppercase;
}
.statement .line{display:block;animation:lineReveal .7s var(--overshoot) backwards}
.statement .line-1{animation-delay:.35s}
.statement .line-2{animation-delay:.55s}
.statement .line-3{animation-delay:.75s}
.statement .hot{
  color:var(--sweet-header-fg-active);
  animation:lineReveal .7s var(--overshoot) .55s backwards,
            hotPulse 3.4s ease-in-out 1.4s infinite;
}
.prompt{
  margin-top:clamp(1.25rem,3.5vw,2rem);
  font-family:ui-monospace,"Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
  font-size:clamp(.78rem,2.8vw,1.02rem);
  color:var(--sweet-tip-fg-inactive);
}
.prompt .user{color:var(--sweet-header-fg-positive)}
.prompt .path{color:var(--sweet-btn-fg-active)}
.prompt .dollar{color:var(--sweet-header-fg-active)}
.caret{
  display:inline-block;width:.55em;height:1.05em;margin-left:.15em;
  background:var(--sweet-header-fg-active);vertical-align:text-bottom;
  animation:caretBlink 1.1s linear infinite;
}
.credit{
  position:fixed;left:0;right:0;bottom:.9rem;z-index:1;
  text-align:center;
  font-size:.68rem;letter-spacing:.28em;text-transform:uppercase;
  color:var(--sweet-win-fg-inactive);
}

/* ---------- Keyframes (8) ---------- */
@keyframes bgDrift{
  0%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(6vmax,4vmax,0) scale(1.12)}
  100%{transform:translate3d(0,0,0) scale(1)}
}
@keyframes bgDriftAlt{
  0%{transform:translate3d(0,0,0) scale(1.05)}
  50%{transform:translate3d(-5vmax,-6vmax,0) scale(.95)}
  100%{transform:translate3d(0,0,0) scale(1.05)}
}
@keyframes cardFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}
@keyframes popIn{
  0%{opacity:0;transform:scale(.92);filter:blur(14px)}
  60%{opacity:1;transform:scale(1.02);filter:blur(0)}
  100%{transform:scale(1)}
}
@keyframes lineReveal{
  0%{opacity:0;transform:translateY(.9em)}
  100%{opacity:1;transform:translateY(0)}
}
@keyframes hotPulse{
  0%,100%{text-shadow:0 0 14px rgba(246,116,0,.55)}
  50%{text-shadow:0 0 34px rgba(246,116,0,.95),0 0 90px rgba(133,0,247,.45)}
}
@keyframes caretBlink{
  0%,49%{opacity:1}
  50%,100%{opacity:0}
}
@keyframes wobble{
  0%{transform:rotate(0)}
  25%{transform:rotate(1.4deg)}
  60%{transform:rotate(-1.4deg)}
  100%{transform:rotate(0)}
}

/* ---------- Desktop-Verfeinerungen (mobile-first Basissatz oben) ---------- */
@media (min-width:720px){
  .statement{letter-spacing:-.025em}
  .stage{padding:3rem}
}
@media (min-width:1200px){
  .card{width:min(80vw,52rem)}
}

/* ---------- Barrierefreiheit: volles Statement, null Motion ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <div class="glow glow-c"></div>
  <div class="vignette"></div>
</div>
<main class="stage">
  <div class="float-wrap">
    <article class="card">
      <p class="eyebrow">Neues aus dem Kopf eines GF</p>
      <h1 class="statement">
        <span class="line line-1">Führung.</span>
        <span class="line line-2 hot">Klarheit.</span>
        <span class="line line-3">Wirkung.</span>
      </h1>
      <p class="prompt"><span class="user">marco@mexord</span><span>: </span><span class="path">~</span><span class="dollar">$ </span>cat management_ki_opensource.txt<span class="caret" aria-hidden="true"></span></p>
    </article>
  </div>
</main>
<p class="credit">Sonde V1 · Sweet Plasma · mexord.blog</p>
</body>
</html>
