<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161925">
<meta name="color-scheme" content="dark">
<title>mexord ▮ sonde v2 — sweet plasma / dr460nized energy</title>
<meta name="description" content="Design-Sonde V2 für mexord.blog: Garuda-Sweet-Neon-Artwork, Glas-Inseln, KWin-Wobble, 20 Animationen, reduced-motion-Fallback.">
<style>
/* ==================================================================
   SONDE V2 — Sweet Plasma / Dr460nized Energy (mexord.blog)
   Farben: ausschließlich sweet.colors (design-tokens.md)
   Team-Brainstorm 2026-10-28:
   · Wanda: Glas-Alpha 0.22, screen-Blend-Glows, Garuda-Flamme,
     Farbdisziplin (1 Fokuspunkt: KLARHEIT.)
   · Franka: Wobble als kontinuierliches KWin-Jelly, Glasschein-Sweep,
     Neon-Zyklus, 20 Keyframes, svh/safe-area, <560px-Layout,
     touch-statt-hover, nur transform/opacity animiert
   · Becky: Inhalte aus mockData-JSON rendern (Hugo-Taxonomie-Vorbereitung),
     Ticker aria-hidden, genau ein h1, semantische Landmarks
   D-001: kein Window-Chrome · D-002: Statement-Set B ·
   D-003: berechnetes Artwork, keine Muster
   ================================================================== */
:root{
  /* Palette (sweet.colors) */
  --sweet-win-bg-normal:#161925;
  --sweet-view-bg-normal:#181B28;
  --sweet-violet:#8500F7;               /* Signaturviolett */
  --sweet-neon-pink:#ED1515;            /* Neon-Pink/Rot */
  --sweet-hot-orange:#F67400;           /* Hot-Orange */
  --sweet-neon-yellow:#C9CE3B;          /* Neongelb */
  --sweet-green:#11D116;                /* Statusgrün */
  --sweet-blue:#3DAEE9;                 /* Aktivblau */
  --sweet-gold:#FDBC4B;                 /* Selection-Gold */
  --sweet-white:#FFFFFF;
  --sweet-dim:#888888;                  /* Sekundärtext */
  --sweet-tip-dim:#BDC3C7;              /* Tooltip-Text */
  /* Glas-Physik (Wanda: alpha 0.22 — V1 0.6 war opak) */
  --glass-bg:rgba(24,27,40,.22);
  --glass-border:rgba(255,255,255,.14);
  --glass-top-light:inset 0 1px 0 rgba(255,255,255,.25);
  --glass-blur:blur(22px) saturate(1.45);
  --overshoot:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--sweet-win-bg-normal);
  color:var(--sweet-white);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  overflow-x:hidden;
  min-height:100svh;
}
::selection{background:var(--sweet-violet);color:var(--sweet-white)}

/* ---------- ARTWORK: Garuda-Flamme, berechnet (D-003) ---------- */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0}
.glow{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen}
.glow-a{ /* Signaturviolett, links unten, dominant */
  width:90vmax;height:90vmax;left:-20vmax;bottom:-25vmax;
  background:radial-gradient(circle,rgba(133,0,247,.55) 0%,rgba(133,0,247,.28) 30%,rgba(133,0,247,0) 60%);
  animation:bgDrift 38s ease-in-out infinite;
}
.glow-b{ /* Neon-Pink, rechts oben — die Flamme */
  width:70vmax;height:70vmax;right:-15vmax;top:-20vmax;
  background:radial-gradient(circle,rgba(237,21,21,.45) 0%,rgba(237,21,21,.2) 32%,rgba(237,21,21,0) 58%);
  animation:bgDriftAlt 47s ease-in-out infinite;
}
.glow-c{ /* Hot-Orange-Kern zwischen Rot und Violett */
  width:50vmax;height:50vmax;right:-5vmax;top:38%;
  background:radial-gradient(circle,rgba(246,116,0,.32) 0%,rgba(246,116,0,0) 55%);
  animation:glowDriftC 53s ease-in-out infinite reverse;
}
.orb{ /* kleine schwebende Akzent-Orbs */
  position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  filter:blur(40px);
}
.orb-1{ /* Gold */
  width:18vmax;height:18vmax;left:12%;top:14%;
  background:rgba(253,188,75,.28);
  animation:orbFloat1 14s ease-in-out infinite alternate;
}
.orb-2{ /* Aktivblau */
  width:14vmax;height:14vmax;right:18%;bottom:12%;
  background:rgba(61,174,233,.25);
  animation:orbFloat2 19s ease-in-out infinite alternate;
}
.vignette{ /* nur unten, hält Statement-Zone lesbar */
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(22,25,37,.25) 0%,rgba(22,25,37,0) 30%,rgba(22,25,37,0) 72%,rgba(22,25,37,.55) 100%);
}

/* ---------- Bühne ---------- */
.stage{
  position:relative;z-index:1;
  min-height:100svh;
  display:grid;place-items:center;
  padding:calc(clamp(1rem,4vw,3rem) + env(safe-area-inset-top)) clamp(1rem,4vw,3rem) calc(clamp(4.5rem,10vh,6rem) + env(safe-area-inset-bottom));
}
.float-wrap{animation:cardMicrotilt 8s ease-in-out infinite alternate;will-change:transform}

/* ---------- Hauptkarte: Glas-Insel ---------- */
.card{
  position:relative;overflow:hidden;
  width:min(92vw,44rem);
  padding:clamp(1.75rem,6vw,3.75rem) clamp(1.25rem,5vw,3.25rem);
  background:var(--glass-bg);
  -webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  border-radius:clamp(16px,3vw,24px);
  box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 40px rgba(133,0,247,.18),var(--glass-top-light);
  text-align:center;
  transform-origin:50% 100%;                     /* KWin-Jelly-Ankerpunkt */
  contain:layout paint;
  will-change:transform;
  animation:wobbleLoop 2.4s ease-in-out infinite,
            borderPulse 3.2s ease-in-out infinite,
            glowDrift 10s linear infinite;
}
.card::before{ /* Glasschein-Sweep */
  content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:38%;
  background:linear-gradient(115deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.12) 50%,rgba(255,255,255,0) 100%);
  transform:translateX(-160%) skewX(-12deg);
  animation:glassSweep 6s ease-in-out 1.2s infinite;
  pointer-events:none;
}
.eyebrow{
  font-size:clamp(.68rem,2.3vw,.92rem);
  font-weight:700;letter-spacing:.25em;text-transform:uppercase;
  color:var(--sweet-blue);
  margin-bottom:clamp(1rem,3vw,1.6rem);
}
.statement{
  font-size:clamp(2.4rem,11vw,5.5rem);
  font-weight:900;line-height:.95;letter-spacing:-.015em;
  text-transform:uppercase;
}
.statement .line{display:block;animation:statementIn .9s ease-out backwards}
.statement .line-1{animation-delay:.2s;animation-name:statementIn,glowPulseAccent;animation-duration:.9s,4s;animation-timing-function:ease-out,ease-in-out;animation-delay:.2s,1.6s;animation-fill-mode:backwards,none;animation-iteration-count:1,infinite}
.statement .line-3{animation-delay:.85s;animation-name:statementIn,glowPulseAccent;animation-duration:.9s,4s;animation-timing-function:ease-out,ease-in-out;animation-delay:.85s,2.2s;animation-fill-mode:backwards,none;animation-iteration-count:1,infinite}
.statement .hot{ /* DER eine Fokuspunkt (Wanda) */
  background:linear-gradient(90deg,var(--sweet-hot-orange) 0%,var(--sweet-neon-pink) 50%,var(--sweet-violet) 100%);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 18px rgba(237,21,21,.45)) drop-shadow(0 0 46px rgba(246,116,0,.3));
  animation:statementIn .9s ease-out .5s backwards,
            neonCycle 8s linear 1.2s infinite;
}
.prompt{
  margin-top:clamp(1.2rem,3.5vw,1.9rem);
  font-family:ui-monospace,"Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
  font-size:clamp(.75rem,2.7vw,1rem);
  color:var(--sweet-tip-dim);
  min-height:1.4em;
}
.prompt .user{color:var(--sweet-green)}
.prompt .path{color:var(--sweet-blue)}
.prompt .dollar{color:var(--sweet-hot-orange)}
.caret{
  display:inline-block;width:.55em;height:1.05em;margin-left:.15em;
  background:var(--sweet-hot-orange);vertical-align:text-bottom;
  animation:caretBlink 1.1s steps(1) infinite;
}

/* ---------- Satelliten-Fenster (Desktop-Insel-Gefühl) ---------- */
.chip{
  position:fixed;z-index:2;
  padding:.6rem 1rem;
  background:rgba(24,27,40,.28);
  -webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  border-radius:999px;
  box-shadow:0 12px 32px rgba(0,0,0,.4),var(--glass-top-light);
  font-family:ui-monospace,"Cascadia Mono",Menlo,monospace;
  font-size:.78rem;letter-spacing:.04em;
  color:var(--sweet-tip-dim);
  animation:chipPopIn .6s var(--overshoot) calc(.9s + var(--i,0)*.18s) backwards,
            chipFloat var(--d,5s) ease-in-out calc(1.6s + var(--i,0)*.18s) infinite alternate;
}
.chip .dot{
  display:inline-block;width:.55em;height:.55em;border-radius:50%;
  background:var(--sweet-green);margin-right:.5em;
  box-shadow:0 0 10px rgba(17,209,22,.9);
  animation:dotPulse 2s ease-in-out infinite;
}
.chip-1{top:calc(1.1rem + env(safe-area-inset-top));left:1.1rem;--i:0;--d:4.5s}
.chip-2{top:calc(1.1rem + env(safe-area-inset-top));right:1.1rem;--i:1;--d:5.8s}
.chip-2 .dot{background:var(--sweet-neon-yellow);box-shadow:0 0 10px rgba(201,206,59,.9)}

/* ---------- Ticker (Complementary-Band, dekorativ) ---------- */
.ticker{
  position:fixed;left:0;right:0;bottom:0;z-index:2;
  padding:calc(.7rem + env(safe-area-inset-bottom)) 0 .7rem;
  background:rgba(22,25,37,.35);
  -webkit-backdrop-filter:blur(22px) saturate(1.45);
  backdrop-filter:blur(22px) saturate(1.45);
  border-top:1px solid var(--glass-border);
  overflow:hidden;white-space:nowrap;
}
.ticker-track{
  display:inline-block;will-change:transform;
  animation:tickerScroll 26s linear infinite;
}
.ticker-item{
  font-family:ui-monospace,"Cascadia Mono",Menlo,monospace;
  font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--sweet-gold);
}
.ticker-sep{color:var(--sweet-neon-yellow);margin:0 1.2rem}

/* ---------- Keyframes (20) ---------- */
@keyframes bgDrift{
  0%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(8vmax,-5vmax,0) scale(1.14)}
  100%{transform:translate3d(0,0,0) scale(1)}
}
@keyframes bgDriftAlt{
  0%{transform:translate3d(0,0,0) scale(1.05)}
  50%{transform:translate3d(-7vmax,6vmax,0) scale(.94)}
  100%{transform:translate3d(0,0,0) scale(1.05)}
}
@keyframes glowDriftC{
  0%{transform:translate3d(0,0,0)}
  50%{transform:translate3d(-10vmax,-9vmax,0)}
  100%{transform:translate3d(0,0,0)}
}
@keyframes orbFloat1{
  0%{transform:translate3d(0,0,0) scale(1)}
  100%{transform:translate3d(4vmax,5vmax,0) scale(1.25)}
}
@keyframes orbFloat2{
  0%{transform:translate3d(0,0,0) scale(1.15)}
  100%{transform:translate3d(-5vmax,-4vmax,0) scale(.9)}
}
@keyframes statementIn{
  0%{opacity:0;transform:translateY(24px)}
  100%{opacity:1;transform:translateY(0)}
}
@keyframes glowPulseAccent{
  0%,100%{text-shadow:0 0 10px rgba(255,255,255,.18)}
  50%{text-shadow:0 0 26px rgba(255,255,255,.4),0 0 70px rgba(133,0,247,.35)}
}
@keyframes neonCycle{
  0%{background-position:0% 50%}
  100%{background-position:220% 50%}
}
@keyframes wobbleLoop{ /* KWin Wobbly-Windows-Jelly, kontinuierlich */
  0%,100%{transform:skewX(0) scale(1)}
  20%{transform:skewX(2.2deg) scale(1.012,.988)}
  45%{transform:skewX(-1.4deg) scale(.992,1.008)}
  70%{transform:skewX(.6deg) scale(1.004,1)}
}
@keyframes cardMicrotilt{
  0%{transform:rotateX(.6deg) rotateY(-.8deg) translateY(0)}
  100%{transform:rotateX(-.5deg) rotateY(.7deg) translateY(-9px)}
}
@keyframes glassSweep{
  0%{transform:translateX(-160%) skewX(-12deg)}
  55%,100%{transform:translateX(340%) skewX(-12deg)}
}
@keyframes borderPulse{
  0%,100%{border-color:rgba(255,255,255,.14)}
  50%{border-color:rgba(133,0,247,.55)}
}
@keyframes glowDrift{ /* innerer Neon-Ring wandert */
  0%{box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 40px rgba(133,0,247,.18),inset 0 1px 0 rgba(255,255,255,.25),inset 12px 0 28px -18px rgba(133,0,247,.6)}
  50%{box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 40px rgba(237,21,21,.18),inset 0 1px 0 rgba(255,255,255,.25),inset -12px 0 28px -18px rgba(237,21,21,.55)}
  100%{box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 40px rgba(133,0,247,.18),inset 0 1px 0 rgba(255,255,255,.25),inset 12px 0 28px -18px rgba(133,0,247,.6)}
}
@keyframes chipPopIn{
  0%{opacity:0;transform:scale(0)}
  70%{opacity:1;transform:scale(1.15)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes chipFloat{
  0%{transform:translateY(0)}
  100%{transform:translateY(-6px)}
}
@keyframes dotPulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.45;transform:scale(.8)}
}
@keyframes tickerScroll{
  0%{transform:translateX(0)}
  100%{transform:translateX(-50%)}
}
@keyframes caretBlink{
  0%,49%{opacity:1}
  50%,100%{opacity:0}
}
@keyframes tapBurst{
  0%{transform:scale(.96)}
  50%{transform:scale(1.05)}
  100%{transform:scale(1)}
}
.tap{animation:tapBurst .5s ease both!important}

/* ---------- Desktop-Verfeinerungen ---------- */
@media (min-width:720px){
  .statement{letter-spacing:-.025em}
  .ticker-item{font-size:.88rem}
}
@media (min-width:1200px){
  .card{width:min(72vw,48rem)}
}
/* ---------- Small Viewport: Chips unter die Karte ---------- */
@media (max-width:560px){
  .chip{
    position:static;
    display:inline-flex;align-items:center;
    margin:.25rem;
  }
  .chip-row{
    position:fixed;left:0;right:0;
    bottom:calc(2.6rem + env(safe-area-inset-bottom));
    z-index:2;display:flex;flex-wrap:wrap;justify-content:center;
  }
}
@media (min-width:561px){
  .chip-row{display:contents}
}
/* ---------- Touch statt Hover ---------- */
@media (hover:none){
  .card:hover{animation:inherit}
}
/* ---------- Barrierefreiheit: komplette statische Version ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .ticker-track{transform:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <div class="glow glow-c"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="vignette"></div>
</div>

<aside class="chip-row" aria-label="Status">
  <!-- data-source: hugo-params (Status, später parameterisiert) -->
  <span class="chip chip-1" id="chip-status"><span class="dot" aria-hidden="true"></span><span id="chip-status-text"></span></span>
  <span class="chip chip-2"><span class="dot" aria-hidden="true"></span><span id="chip-mode-text"></span></span>
</aside>

<main class="stage">
  <div class="float-wrap">
    <article class="card" id="hero-card">
      <p class="eyebrow">Neues aus dem Kopf eines GF</p>
      <h1 class="statement">
        <span class="line line-1">Führung.</span>
        <span class="line hot">Klarheit.</span>
        <span class="line line-3">Wirkung.</span>
      </h1>
      <p class="prompt" aria-live="off"><span class="user">marco@mexord</span><span>:</span> <span class="path">~</span><span class="dollar">$ </span><span id="typed"></span><span class="caret" aria-hidden="true"></span></p>
    </article>
  </div>
</main>

<div class="ticker" aria-hidden="true">
  <div class="ticker-track" id="ticker-track"><!-- data-source: taxonomy:themes (Becky) --></div>
</div>

<noscript>
  <style>.ticker::after{content:"KI-STRATEGIE ✕ OPEN SOURCE ✕ PRAXISTEST ✕ WIRTSCHAFTLICHKEIT ✕ SOFTWARE ✕ AUTOMATISIERUNG ✕ SICHERHEIT ✕ FÜHRUNG ✕ ERFAHRUNGEN ✕ AUSBLICK";display:block;text-align:center;font-size:.8rem;color:#FDBC4B;letter-spacing:.08em}#typed::after{content:"cat management_ki_opensource.txt"}#chip-status-text::after{content:"system online"}#chip-mode-text::after{content:"dr460nized mode"}</style>
</noscript>

<script>
/* Becky-Prinzip: Inhalte datengetrieben (Vorbereitung auf Hugo-Taxonomie) */
const mockData = {
  status: "system online — letztes deploy: ok",
  mode: "dr460nized mode · sweet",
  promptCommand: "cat management_ki_opensource.txt",
  themes: [
    "KI-Strategie","Open Source","Praxistest","Wirtschaftlichkeit","Software",
    "Automatisierung","Sicherheit","Führung","Eigene Erfahrungen","Ausblick"
  ]
};

const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Ticker: Inhalt doppelt für Endlos-Loop (kein Reflow) */
(function renderTicker(){
  const track = document.getElementById("ticker-track");
  const seq = mockData.themes
    .map(t => `<span class="ticker-item">${t}</span><span class="ticker-sep">✕</span>`)
    .join("");
  track.innerHTML = seq + seq;
})();

/* Chips */
document.getElementById("chip-status-text").textContent = mockData.status;
document.getElementById("chip-mode-text").textContent = mockData.mode;

/* Terminal-Typing: setInterval auf textContent, kein Layout-Read im Loop */
(function typing(){
  const el = document.getElementById("typed");
  const text = mockData.promptCommand;
  if (reduced) { el.textContent = text; return; }   /* volle Info, null Motion */
  let i = 0;
  const iv = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i >= text.length) clearInterval(iv);
  }, 55);
})();

/* Touch-Feedback statt Hover (Franka: @media hover:none + tap-burst) */
(function touchBurst(){
  const card = document.getElementById("hero-card");
  if (!window.matchMedia("(hover: none)").matches || reduced) return;
  card.addEventListener("touchstart", () => {
    card.classList.remove("tap");
    void card.offsetWidth;                          /* Animations-Restart */
    card.classList.add("tap");
  }, { passive: true });
})();
</script>
</body>
</html>
